org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+UseG1GC -XX:G1PeriodicGCInterval=60000
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=true
# Idle daemons hand their heap back to the OS (periodic G1 GC), so they can stay warm while the emulators run.
kotlin.daemon.jvmargs=-Xmx4g -XX:+UseG1GC -XX:G1PeriodicGCInterval=60000
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
