name: Web player's FFmpeg
description: >-
  Puts the browser player's libav.js build (web/libav/build.sh) in web/public/libav/: from the cache when
  web/libav hasn't changed, else built with emsdk and cached.

inputs:
  root:
    description: The checkout that holds web/, relative to the workspace.
    default: .

runs:
  using: composite
  steps:
    - id: cache
      uses: actions/cache/restore@v6
      with:
        path: ${{ inputs.root }}/web/public/libav
        key: web-libav-${{ hashFiles(format('{0}/web/libav/config.json', inputs.root), format('{0}/web/libav/build.sh', inputs.root)) }}

    - if: steps.cache.outputs.cache-hit != 'true'
      uses: mymindstorm/setup-emsdk@v16
      with:
        version: 6.0.5

    - if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: bash "${{ inputs.root }}/web/libav/build.sh"

    - if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ inputs.root }}/web/public/libav
        key: ${{ steps.cache.outputs.cache-primary-key }}
