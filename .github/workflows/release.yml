name: Release

# For a version tag (v1.1, v1.2.3), which has to match appVersion in app/build.gradle.kts:
# - the Play upload bundle, signed with the upload key from the secrets YARMIPLAYTV_KEYSTORE_BASE64,
#   YARMIPLAYTV_KEYSTORE_PASSWORD, YARMIPLAYTV_KEY_ALIAS and YARMIPLAYTV_KEY_PASSWORD; with the variable
#   PLAY_TRACK and the secret PLAY_SERVICE_ACCOUNT_JSON it is uploaded to that Play Console track;
# - the Windows installer (.msi) and portable zip, attached to the tag's GitHub release, where the download
#   page and winget take them from. They are released unsigned for now; once the variable
#   SIGNPATH_ORGANIZATION_ID and the secret SIGNPATH_API_TOKEN are set, they are first code signed through
#   SignPath (certificate by SignPath Foundation) after an approver accepts the signing request;
# - the Microsoft Store package (.msix, unsigned: the Store signs it), attached to the run; with the variables
#   MSSTORE_TENANT_ID, MSSTORE_SELLER_ID and MSSTORE_CLIENT_ID and the secret MSSTORE_CLIENT_SECRET it is
#   submitted to Partner Center for certification;
# - with the variable WINGET_PACKAGE_ID and the secret WINGET_TOKEN, a pull request to microsoft/winget-pkgs
#   with the release's .msi;
# - the Linux .deb (yarmiplaytv_<desktop version>_amd64.deb and its .sha256), attached to the release. The
#   metainfo (packaging/linux) needs a <release> for the desktop version (scripts/bump-version.py adds it). From
#   the release's .deb, each switched on by its variable:
#   - AUR_PACKAGE (yarmiplaytv-bin) and the secret AUR_SSH_PRIVATE_KEY: the AUR package, tested in Arch Linux;
#   - SNAP_NAME (yarmiplaytv) and the secret SNAPCRAFT_STORE_CREDENTIALS: the snap, released to the channel in
#     SNAP_CHANNEL (default stable);
#   - FLATHUB_REPO (flathub/com.yarmiplay.TV) and the secret FLATHUB_TOKEN: a pull request to the app's Flathub
#     repository with the manifest pointing at the tag, merged automatically when the repository allows it.
# A manual run builds everything again; its inputs submit or publish to a store, the Linux ones for the latest
# release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      msstore:
        description: Submit the Store package to Partner Center
        type: boolean
        default: false
      play:
        description: Upload the bundle to the Google Play track in PLAY_TRACK
        type: boolean
        default: false
      aur:
        description: Push the latest release to the AUR
        type: boolean
        default: false
      snap:
        description: Publish the latest release to the Snap Store
        type: boolean
        default: false
      flathub:
        description: Update Flathub to the latest release (without FLATHUB_REPO, only the files as an artifact)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag against appVersion
        run: |
          version=$(sed -n 's/^val appVersion = "\(.*\)"/\1/p' app/build.gradle.kts)
          echo "appVersion $version"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match appVersion $version"; exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-36 build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.YARMIPLAYTV_KEYSTORE_BASE64 }}
        run: |
          [ -n "$KEYSTORE_BASE64" ] || { echo "::error::The YARMIPLAYTV_KEYSTORE_BASE64 secret isn't set"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "YARMIPLAYTV_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Signed bundle
        env:
          YARMIPLAYTV_KEYSTORE_PASSWORD: ${{ secrets.YARMIPLAYTV_KEYSTORE_PASSWORD }}
          YARMIPLAYTV_KEY_ALIAS: ${{ secrets.YARMIPLAYTV_KEY_ALIAS }}
          YARMIPLAYTV_KEY_PASSWORD: ${{ secrets.YARMIPLAYTV_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --stacktrace :app:bundleRelease
          aab=app/build/outputs/bundle/release/app-release.aab
          jarsigner -verify "$aab" | tee "$RUNNER_TEMP/verify.txt"
          grep -q "jar verified" "$RUNNER_TEMP/verify.txt"
          mv "$aab" "yarmiplaytv-$VERSION.aab"
          rm -f "$RUNNER_TEMP/upload.jks"

      - uses: actions/upload-artifact@v7
        with:
          name: play-bundle-${{ env.VERSION }}
          path: yarmiplaytv-*.aab
          if-no-files-found: error
          retention-days: 90

  # The app's first bundle has to be uploaded by hand; while the app has never been reviewed, Play only takes
  # releases with the status draft (variable PLAY_RELEASE_STATUS). Play rejects a version code it has seen, so a
  # manual run only uploads a version that isn't on Play yet.
  play:
    needs: bundle
    if: (github.ref_type == 'tag' || inputs.play) && vars.PLAY_TRACK != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: play-bundle-*
          merge-multiple: true
          path: bundle

      - uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.yarmiplaytv
          releaseFiles: bundle/*.aab
          track: ${{ vars.PLAY_TRACK }}
          status: ${{ vars.PLAY_RELEASE_STATUS || 'completed' }}

  windows-installers:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    outputs:
      version: ${{ steps.version.outputs.version }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag against appVersion
        id: version
        run: |
          version=$(sed -n 's/^val appVersion = "\(.*\)"/\1/p' app/build.gradle.kts)
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match appVersion $version"; exit 1
          fi
          desktop=$(sed -n 's/^val appVersion = "\(.*\)"/\1/p' desktop/build.gradle.kts)
          echo "desktop appVersion $desktop"
          echo "version=$desktop" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      # SignPath's artifact configuration (.github/signpath/artifact-configuration.xml) expects the .msi and
      # the portable zip at the root of the artifact.
      - name: Installers
        run: |
          chmod +x gradlew
          ./gradlew --stacktrace :desktop:packageMsi :desktop:packagePortableZip
          mkdir windows
          cp desktop/build/compose/binaries/main/msi/*.msi desktop/build/compose/binaries/main/portable/*.zip windows/
          ls -l windows

      - name: jpackage logs
        if: failure()
        run: cat desktop/build/compose/logs/*/*.txt || true

      - id: upload
        uses: actions/upload-artifact@v7
        with:
          name: windows-installers-unsigned
          path: windows/
          if-no-files-found: error
          retention-days: 7

      # Kept out of the SignPath artifact: the Store signs the package itself when it is uploaded.
      - name: Store package
        run: |
          ./gradlew --stacktrace :desktop:createDistributable
          pwsh -NoProfile -File scripts/make-msix.ps1 -NoBuild

      - uses: actions/upload-artifact@v7
        with:
          name: windows-store-msix-${{ steps.version.outputs.version }}
          path: desktop/build/msix/*.msix
          if-no-files-found: error
          retention-days: 90

  # Replaces the package of the published submission (the listing stays) and commits it for certification.
  # A draft submission started in Partner Center is discarded.
  msstore:
    needs: windows-installers
    if: (github.ref_type == 'tag' || inputs.msstore) && vars.MSSTORE_CLIENT_ID != ''
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: windows-store-msix-${{ needs.windows-installers.outputs.version }}
          path: msix

      - uses: microsoft/setup-msstore-cli@v1

      - name: Submit to the Microsoft Store
        shell: pwsh
        env:
          TENANT_ID: ${{ vars.MSSTORE_TENANT_ID }}
          SELLER_ID: ${{ vars.MSSTORE_SELLER_ID }}
          CLIENT_ID: ${{ vars.MSSTORE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.MSSTORE_CLIENT_SECRET }}
        run: |
          msstore reconfigure --tenantId $env:TENANT_ID --sellerId $env:SELLER_ID --clientId $env:CLIENT_ID --clientSecret $env:CLIENT_SECRET
          if ($LASTEXITCODE -ne 0) { throw "msstore reconfigure failed" }
          $msix = (Get-Item msix\*.msix).FullName
          msstore publish $msix --appId 9PDBVR6W069J
          if ($LASTEXITCODE -ne 0) { throw "msstore publish failed" }

  # Waits on a Linux runner while the signing request awaits manual approval in SignPath.
  sign-windows:
    needs: windows-installers
    if: vars.SIGNPATH_ORGANIZATION_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Submit the signing request and wait for its approval
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: YarmiplayTV
          signing-policy-slug: release-signing
          github-artifact-id: ${{ needs.windows-installers.outputs.artifact-id }}
          parameters: |
            version: ${{ toJSON(needs.windows-installers.outputs.version) }}
          wait-for-completion-timeout-in-seconds: 21000
          output-artifact-directory: signed

      - uses: actions/upload-artifact@v7
        with:
          name: windows-installers-signed
          path: signed/
          if-no-files-found: error
          retention-days: 7

  # Attaches the .msi and portable zip to the tag's release: the signed ones when SignPath is set up, checked
  # the way Windows does (the .msi and the launcher inside each), otherwise the unsigned ones.
  publish-windows:
    needs: [windows-installers, sign-windows]
    if: >-
      always() && needs.windows-installers.result == 'success' &&
      (needs.sign-windows.result == 'success' || needs.sign-windows.result == 'skipped')
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      SIGNED: ${{ needs.sign-windows.result == 'success' }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts

      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.sign-windows.result == 'success' && 'windows-installers-signed' || 'windows-installers-unsigned' }}
          path: windows

      - name: Verify the signatures
        if: env.SIGNED == 'true'
        shell: pwsh
        run: |
          $msi = Get-Item windows\*.msi
          Start-Process msiexec -Wait -ArgumentList "/a `"$($msi.FullName)`" /qn TARGETDIR=`"$env:RUNNER_TEMP\msi`""
          Expand-Archive (Get-Item windows\*.zip).FullName "$env:RUNNER_TEMP\zip"
          $files = @($msi) + @(Get-ChildItem "$env:RUNNER_TEMP\msi", "$env:RUNNER_TEMP\zip" -Recurse -Filter YarmiplayTV.exe)
          if ($files.Count -ne 3) { throw "expected the .msi and the launchers inside the .msi and the zip, found $($files.Count) files" }
          foreach ($file in $files) {
            $sig = Get-AuthenticodeSignature $file.FullName
            "{0}: {1}, {2}" -f $file.Name, $sig.Status, $sig.SignerCertificate.Subject
            if ($sig.Status -ne 'Valid' -or -not $sig.TimeStamperCertificate) { throw "$($file.Name) isn't validly signed and timestamped" }
          }

      # Rewrites the notes too: the Linux job may have created the release without knowing about signing.
      - name: Attach the installers to the release
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.windows-installers.outputs.version }}
          WINGET_ID: ${{ vars.WINGET_PACKAGE_ID }}
          AUR_PACKAGE: ${{ vars.AUR_PACKAGE }}
          SNAP_NAME: ${{ vars.SNAP_NAME }}
          FLATHUB_REPO: ${{ vars.FLATHUB_REPO }}
          SET_NOTES: true
        run: bash scripts/publish-release.sh windows/*

  # Opens the pull request that adds the release's .msi to winget, from the token owner's fork of
  # microsoft/winget-pkgs. The package has to be in winget already (the first version is submitted by hand
  # with wingetcreate, see the README).
  winget:
    needs: [windows-installers, publish-windows]
    if: >-
      always() && needs.publish-windows.result == 'success' && github.ref_type == 'tag' &&
      vars.WINGET_PACKAGE_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: vedantmgoyal9/winget-releaser@main
        with:
          identifier: ${{ vars.WINGET_PACKAGE_ID }}
          version: ${{ needs.windows-installers.outputs.version }}
          release-tag: ${{ github.ref_name }}
          installers-regex: '\.msi$'
          token: ${{ secrets.WINGET_TOKEN }}

  # The .deb, built on the oldest supported Ubuntu so its library dependencies install on newer ones too, and
  # installed once to check that it starts.
  linux-installers:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag against appVersion, and the metainfo
        id: version
        run: |
          version=$(sed -n 's/^val appVersion = "\(.*\)"/\1/p' app/build.gradle.kts)
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match appVersion $version"; exit 1
          fi
          desktop=$(sed -n 's/^val appVersion = "\(.*\)"/\1/p' desktop/build.gradle.kts)
          echo "desktop appVersion $desktop"
          if ! grep -q "<release version=\"$desktop\"" packaging/linux/com.yarmiplay.TV.metainfo.xml; then
            echo "::error::packaging/linux/com.yarmiplay.TV.metainfo.xml has no <release version=\"$desktop\">; scripts/bump-version.py adds it"
            exit 1
          fi
          echo "VERSION=$desktop" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: .deb
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q fakeroot
          chmod +x gradlew
          ./gradlew --stacktrace -PdesktopOnly :desktop:packageDeb
          mkdir linux
          name="yarmiplaytv_${VERSION}_amd64.deb"
          cp desktop/build/compose/binaries/main/deb/*.deb "linux/$name"
          (cd linux && sha256sum "$name" > "$name.sha256")
          dpkg-deb -f "linux/$name" Version Depends

      # The package registers its menu entry with xdg-desktop-menu, which needs the menu directories a desktop
      # install has and the runner image lacks.
      - name: Install the .deb and start it
        run: |
          sudo mkdir -p /etc/xdg/menus/applications-merged /usr/share/applications /usr/share/desktop-directories
          sudo apt-get install -y -q ./linux/*.deb
          /opt/yarmiplaytv/bin/YarmiplayTV --version | tee "$RUNNER_TEMP/version.txt"
          grep -q "YarmiplayTV $VERSION, libmpv [0-9]" "$RUNNER_TEMP/version.txt"

      - name: jpackage logs
        if: failure()
        run: cat desktop/build/compose/logs/*/*.txt || true

      - uses: actions/upload-artifact@v7
        with:
          name: linux-deb-${{ env.VERSION }}
          path: linux/
          if-no-files-found: error
          retention-days: 90

      - name: Attach the .deb to the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          WINGET_ID: ${{ vars.WINGET_PACKAGE_ID }}
          AUR_PACKAGE: ${{ vars.AUR_PACKAGE }}
          SNAP_NAME: ${{ vars.SNAP_NAME }}
          FLATHUB_REPO: ${{ vars.FLATHUB_REPO }}
        run: bash scripts/publish-release.sh linux/*

  # Builds the package from the release's .deb in Arch Linux, installs it and plays a clip, then pushes the
  # PKGBUILD and .SRCINFO to the AUR. The first push creates the package. AUR_PACKAGE has to be the PKGBUILD's
  # pkgname (yarmiplaytv-bin).
  aur:
    needs: linux-installers
    if: (github.ref_type == 'tag' || inputs.aur) && vars.AUR_PACKAGE != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/release-deb.sh

      - name: Build and test the package in Arch Linux
        env:
          VERSION: ${{ steps.release.outputs.version }}
          TAG: ${{ steps.release.outputs.tag }}
        run: docker run --rm -v "$PWD:/src" -w /src archlinux:latest bash scripts/aur-package.sh "$VERSION" "${TAG#v}"

      - name: Push to the AUR
        env:
          AUR_PACKAGE: ${{ vars.AUR_PACKAGE }}
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          grep -qx "pkgname=$AUR_PACKAGE" aur-out/PKGBUILD ||
            { echo "::error::AUR_PACKAGE $AUR_PACKAGE isn't the PKGBUILD's pkgname"; exit 1; }
          [ -n "$AUR_SSH_PRIVATE_KEY" ] || { echo "::error::The AUR_SSH_PRIVATE_KEY secret isn't set"; exit 1; }
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur && chmod 600 ~/.ssh/aur
          ssh-keyscan -t ed25519 aur.archlinux.org >> ~/.ssh/known_hosts 2> /dev/null
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/aur -o IdentitiesOnly=yes"
          git clone "ssh://aur@aur.archlinux.org/$AUR_PACKAGE.git" aur-repo
          cp aur-out/PKGBUILD aur-out/.SRCINFO aur-repo/
          cd aur-repo
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then echo "The AUR already has this version"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Update to $VERSION"
          git push origin HEAD:master

  # Builds the snap from the release's .deb, installs it and plays a clip, then releases it to SNAP_CHANNEL.
  # SNAP_NAME has to be snap/snapcraft.yaml's name (yarmiplaytv), registered with snapcraft register.
  snap:
    needs: linux-installers
    if: (github.ref_type == 'tag' || inputs.snap) && vars.SNAP_NAME != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/release-deb.sh
          cp deb/*.deb yarmiplaytv.deb

      - uses: snapcore/action-build@v1
        id: build

      - name: Install the snap and play a clip
        run: bash scripts/snap-smoke-test.sh "${{ steps.build.outputs.snap }}"

      - uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.build.outputs.snap }}
          release: ${{ vars.SNAP_CHANNEL || 'stable' }}

  # Points the Flatpak manifest at the release tag, lists the Gradle files its offline build needs, and opens a
  # pull request with them on the app's Flathub repository; Flathub builds the pull request as its test, and it
  # is merged automatically when the repository allows auto-merge. A manual run without FLATHUB_REPO (before
  # the app is on Flathub) only uploads the files: the first submission to flathub/flathub is made of them.
  flathub:
    needs: linux-installers
    if: (github.ref_type == 'tag' && vars.FLATHUB_REPO != '') || inputs.flathub
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/release-deb.sh
          git checkout "$(sed -n 's/^tag=//p' "$GITHUB_OUTPUT")"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      # A build with an empty Gradle home downloads exactly what the Flatpak build needs.
      - name: List the Gradle files
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/gradle-home
        run: |
          chmod +x gradlew
          ./gradlew --no-configuration-cache --no-build-cache -PdesktopOnly :desktop:generateAppIcons :desktop:createDistributable
          python3 scripts/flatpak_gradle_sources.py "$GRADLE_USER_HOME" packaging/flatpak/gradle-sources.json

      - name: Point the manifest at the tag
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          mkdir flathub-files
          sed -E -e "s#^( +)path: \.\./\.\.\$#\1url: https://github.com/$GITHUB_REPOSITORY.git#" \
            -e "s#^( +)branch: main\$#\1tag: $TAG\n\1commit: $(git rev-parse HEAD)#" \
            packaging/flatpak/com.yarmiplay.TV.yml > flathub-files/com.yarmiplay.TV.yml
          ! grep -q "path: \.\./\.\.\|branch: main" flathub-files/com.yarmiplay.TV.yml
          grep -q "^ *commit: [0-9a-f]\{40\}$" flathub-files/com.yarmiplay.TV.yml
          cp packaging/flatpak/gradle-sources.json packaging/flatpak/flathub.json flathub-files/

      - uses: actions/upload-artifact@v7
        with:
          name: flathub-${{ steps.release.outputs.version }}
          path: flathub-files/
          if-no-files-found: error
          retention-days: 90

      - name: Open the pull request on Flathub
        if: vars.FLATHUB_REPO != ''
        env:
          GH_TOKEN: ${{ secrets.FLATHUB_TOKEN }}
          FLATHUB_REPO: ${{ vars.FLATHUB_REPO }}
          VERSION: ${{ steps.release.outputs.version }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          [ -n "$GH_TOKEN" ] || { echo "::error::The FLATHUB_TOKEN secret isn't set"; exit 1; }
          gh auth setup-git
          gh repo clone "$FLATHUB_REPO" flathub-repo -- --depth 1
          cd flathub-repo
          branch="release-$VERSION"
          git checkout -b "$branch"
          cp ../flathub-files/* .
          git add -A
          if git diff --cached --quiet; then echo "Flathub already has this version"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Update to $VERSION ($TAG)"
          git push --force origin "$branch"
          url=$(gh pr view "$branch" -R "$FLATHUB_REPO" --json url -q .url 2> /dev/null ||
            gh pr create -R "$FLATHUB_REPO" --head "$branch" --title "Update to $VERSION" \
              --body "YarmiplayTV $VERSION: https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG")
          echo "Pull request: $url"
          gh pr merge "$url" --auto --merge ||
            echo "::warning::$FLATHUB_REPO doesn't allow auto-merge; merge $url once Flathub's test build passes"
