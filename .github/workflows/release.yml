name: Release

# For a version tag (v1.1, v1.2.3), which has to match appVersion in app/build.gradle.kts:
# - the Play upload bundle, signed with the upload key from the secrets YARMIPLAYTV_KEYSTORE_BASE64,
#   YARMIPLAYTV_KEYSTORE_PASSWORD, YARMIPLAYTV_KEY_ALIAS and YARMIPLAYTV_KEY_PASSWORD;
# - the Windows installers, attached to the tag's GitHub release, where the download page and winget take them
#   from. With the variable SIGNPATH_ORGANIZATION_ID and the secret SIGNPATH_API_TOKEN they are first code
#   signed through SignPath (certificate by SignPath Foundation), once an approver accepts the signing request;
#   without them the unsigned installers are released;
# - the Microsoft Store package (.msix, unsigned: the Store signs it), attached to the run for uploading in
#   Partner Center;
# - with the variable WINGET_PACKAGE_ID and the secret WINGET_TOKEN, a pull request to microsoft/winget-pkgs
#   with the release's .msi.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag against appVersion
        run: |
          version=$(sed -n 's/^val appVersion = "\(.*\)"/\1/p' app/build.gradle.kts)
          echo "appVersion $version"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match appVersion $version"; exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-36 build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.YARMIPLAYTV_KEYSTORE_BASE64 }}
        run: |
          [ -n "$KEYSTORE_BASE64" ] || { echo "::error::The YARMIPLAYTV_KEYSTORE_BASE64 secret isn't set"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "YARMIPLAYTV_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Signed bundle
        env:
          YARMIPLAYTV_KEYSTORE_PASSWORD: ${{ secrets.YARMIPLAYTV_KEYSTORE_PASSWORD }}
          YARMIPLAYTV_KEY_ALIAS: ${{ secrets.YARMIPLAYTV_KEY_ALIAS }}
          YARMIPLAYTV_KEY_PASSWORD: ${{ secrets.YARMIPLAYTV_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --stacktrace :app:bundleRelease
          aab=app/build/outputs/bundle/release/app-release.aab
          jarsigner -verify "$aab" | tee "$RUNNER_TEMP/verify.txt"
          grep -q "jar verified" "$RUNNER_TEMP/verify.txt"
          mv "$aab" "yarmiplaytv-$VERSION.aab"
          rm -f "$RUNNER_TEMP/upload.jks"

      - uses: actions/upload-artifact@v7
        with:
          name: play-bundle-${{ env.VERSION }}
          path: yarmiplaytv-*.aab
          if-no-files-found: error
          retention-days: 90

  windows-installers:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    outputs:
      version: ${{ steps.version.outputs.version }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag against appVersion
        id: version
        run: |
          version=$(sed -n 's/^val appVersion = "\(.*\)"/\1/p' app/build.gradle.kts)
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match appVersion $version"; exit 1
          fi
          desktop=$(sed -n 's/^val appVersion = "\(.*\)"/\1/p' desktop/build.gradle.kts)
          echo "desktop appVersion $desktop"
          echo "version=$desktop" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      # SignPath's artifact configuration (.github/signpath/artifact-configuration.xml) expects the two
      # installers at the root of the artifact.
      - name: Installers
        run: |
          chmod +x gradlew
          ./gradlew --stacktrace :desktop:packageMsi :desktop:packageExe
          mkdir windows
          cp desktop/build/compose/binaries/main/msi/*.msi desktop/build/compose/binaries/main/exe/*.exe windows/
          ls -l windows

      - name: jpackage logs
        if: failure()
        run: cat desktop/build/compose/logs/*/*.txt || true

      - id: upload
        uses: actions/upload-artifact@v7
        with:
          name: windows-installers-unsigned
          path: windows/
          if-no-files-found: error
          retention-days: 7

      # Kept out of the SignPath artifact: the Store signs the package itself when it is uploaded.
      - name: Store package
        run: |
          ./gradlew --stacktrace :desktop:createDistributable
          pwsh -NoProfile -File scripts/make-msix.ps1 -NoBuild

      - uses: actions/upload-artifact@v7
        with:
          name: windows-store-msix-${{ steps.version.outputs.version }}
          path: desktop/build/msix/*.msix
          if-no-files-found: error
          retention-days: 90

  # Waits on a Linux runner while the signing request awaits manual approval in SignPath.
  sign-windows:
    needs: windows-installers
    if: vars.SIGNPATH_ORGANIZATION_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Submit the signing request and wait for its approval
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: YarmiplayTV
          signing-policy-slug: release-signing
          github-artifact-id: ${{ needs.windows-installers.outputs.artifact-id }}
          parameters: |
            version: ${{ toJSON(needs.windows-installers.outputs.version) }}
          wait-for-completion-timeout-in-seconds: 21000
          output-artifact-directory: signed

      - uses: actions/upload-artifact@v7
        with:
          name: windows-installers-signed
          path: signed/
          if-no-files-found: error
          retention-days: 7

  # Attaches the installers to the tag's release: the signed ones when SignPath is set up, checked the way
  # Windows does (including the launcher inside the .msi), otherwise the unsigned ones.
  publish-windows:
    needs: [windows-installers, sign-windows]
    if: >-
      always() && needs.windows-installers.result == 'success' &&
      (needs.sign-windows.result == 'success' || needs.sign-windows.result == 'skipped')
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      SIGNED: ${{ needs.sign-windows.result == 'success' }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.sign-windows.result == 'success' && 'windows-installers-signed' || 'windows-installers-unsigned' }}
          path: windows

      - name: Verify the signatures
        if: env.SIGNED == 'true'
        shell: pwsh
        run: |
          $msi = Get-Item windows\*.msi
          Start-Process msiexec -Wait -ArgumentList "/a `"$($msi.FullName)`" /qn TARGETDIR=`"$env:RUNNER_TEMP\msi`""
          $files = @(Get-Item windows\*.msi, windows\*.exe) + @(Get-ChildItem "$env:RUNNER_TEMP\msi" -Recurse -Filter YarmiplayTV.exe)
          if ($files.Count -ne 3) { throw "expected the .msi, the .exe and the launcher inside the .msi, found $($files.Count) files" }
          foreach ($file in $files) {
            $sig = Get-AuthenticodeSignature $file.FullName
            "{0}: {1}, {2}" -f $file.Name, $sig.Status, $sig.SignerCertificate.Subject
            if ($sig.Status -ne 'Valid' -or -not $sig.TimeStamperCertificate) { throw "$($file.Name) isn't validly signed and timestamped" }
          }

      - name: Attach the installers to the release
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.windows-installers.outputs.version }}
          WINGET_ID: ${{ vars.WINGET_PACKAGE_ID }}
        run: |
          if gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" windows/* -R "$GITHUB_REPOSITORY" --clobber
          else
            notes="Windows installers for YarmiplayTV $VERSION${WINGET_ID:+ (or \`winget install $WINGET_ID\`)}. Other platforms: https://yarmiplay.github.io/YarmiplayTV/"
            if [ "$SIGNED" = true ]; then
              notes="$notes

          Free code signing provided by [SignPath.io](https://signpath.io), certificate by [SignPath Foundation](https://signpath.org). See the [code signing policy](https://github.com/$GITHUB_REPOSITORY#code-signing-policy)."
            fi
            gh release create "$GITHUB_REF_NAME" windows/* -R "$GITHUB_REPOSITORY" --verify-tag \
              --title "YarmiplayTV $GITHUB_REF_NAME" --notes "$notes"
          fi

  # Opens the pull request that adds the release's .msi to winget, from the token owner's fork of
  # microsoft/winget-pkgs. The package has to be in winget already (the first version is submitted by hand
  # with wingetcreate, see the README).
  winget:
    needs: [windows-installers, publish-windows]
    if: >-
      always() && needs.publish-windows.result == 'success' && github.ref_type == 'tag' &&
      vars.WINGET_PACKAGE_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: vedantmgoyal9/winget-releaser@main
        with:
          identifier: ${{ vars.WINGET_PACKAGE_ID }}
          version: ${{ needs.windows-installers.outputs.version }}
          release-tag: ${{ github.ref_name }}
          installers-regex: '\.msi$'
          token: ${{ secrets.WINGET_TOKEN }}
