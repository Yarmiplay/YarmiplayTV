name: Snap

# Builds and, when publish is set, releases the snap for the latest GitHub release's .deb.
# Does not build the Android, Windows, macOS or .deb installers. A version tag uses release.yml instead.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the built snap to the Snap Store
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  snap-seed:
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        # macOS left out: its runner sometimes queues 5-15 minutes and holds the snap job back, and it was never
        # the only leg that reached the store.
        os: [ubuntu-24.04-arm, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      # One runner that reaches the store is enough (the snap job takes whichever set came through), so a runner
      # that can't is a warning, not a failed job.
      - name: Download content snaps from the Snap Store
        id: fetch
        continue-on-error: true
        run: bash scripts/snap-fetch.sh snap-seed

      - name: Note a runner that couldn't reach the store
        if: steps.fetch.outcome == 'failure'
        run: echo "::warning::${{ matrix.os }} couldn't download the content snaps from the Snap Store; another runner's are used."

      - uses: actions/upload-artifact@v7
        if: steps.fetch.outcome == 'success'
        with:
          name: content-snaps-${{ matrix.os }}
          path: snap-seed/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  snap:
    needs: snap-seed
    if: always() && needs.snap-seed.result != 'cancelled'
    runs-on: ubuntu-latest
    # A stuck stage-package download fails in half an hour instead of holding the run for ninety minutes.
    timeout-minutes: 30
    env:
      # Next to GitHub's runners; archive.ubuntu.com has taken from 15 s to 27 min for the same stage-packages.
      UBUNTU_MIRROR: http://azure.archive.ubuntu.com/ubuntu/
    outputs:
      built: ${{ steps.build.outputs.built }}
    steps:
      - uses: actions/checkout@v7

      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/release-deb.sh
          cp deb/*.deb yarmiplaytv.deb

      # One set is enough: the Arm runner's, or Windows' when Arm couldn't reach the store (each set is several
      # hundred MB, so downloading both cost a minute or two).
      - name: Content snaps (ubuntu-24.04-arm)
        id: seed-arm
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: content-snaps-ubuntu-24.04-arm
          path: snap-seeds/arm

      - name: Content snaps (windows-latest)
        if: steps.seed-arm.outcome != 'success'
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: content-snaps-windows-latest
          path: snap-seeds/win

      - name: Choose one content-snap set
        run: |
          mkdir -p snap-seed
          found=
          if [[ -d snap-seeds ]]; then
            while IFS= read -r file; do
              dir=$(dirname "$file")
              if [[ -f "$dir/bare.snap" && -f "$dir/core24.snap" && -f "$dir/gtk-common-themes.snap" && -f "$dir/gnome-46-2404.snap" && -f "$dir/mesa-2404.snap" ]]; then
                found=$dir
                break
              fi
            done < <(find snap-seeds -name bare.snap -print)
          fi
          if [[ -z "$found" ]]; then
            echo "No runner could download the content snaps."
            exit 1
          fi
          cp -a "$found"/*.snap snap-seed/
          echo "Using $found"
          ls -lh snap-seed

      - name: Diagnose the Snap Store route
        run: bash scripts/snap-store-route.sh

      # The stage-packages' .debs, kept a week; apt checks each against the current index, so a stale one is
      # downloaded again rather than used.
      - id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/snapcraft-cache/download
          key: snapcraft-debs-${{ hashFiles('snap/snapcraft.yaml') }}-${{ steps.week.outputs.week }}
          restore-keys: snapcraft-debs-

      - id: build
        run: |
          export SNAPCRAFT_CACHE_DIR="$RUNNER_TEMP/snapcraft-cache"
          bash scripts/snapcraft-build.sh
          # Written as root in the container; the cache step reads it as the runner user.
          sudo chown -R "$(id -u):$(id -g)" "$SNAPCRAFT_CACHE_DIR" || true
          shopt -s nullglob
          snaps=(*.snap)
          if ((${#snaps[@]} == 0)); then
            echo "built=false" >> "$GITHUB_OUTPUT"
            echo "::error::No .snap was produced"
            exit 1
          fi
          echo "snap=${snaps[0]}" >> "$GITHUB_OUTPUT"
          echo "built=true" >> "$GITHUB_OUTPUT"
          echo "SNAP_BUILT=${snaps[0]}" >> "$GITHUB_STEP_SUMMARY"

      - name: Install the snap and play a clip
        run: bash scripts/snap-smoke-test.sh "${{ steps.build.outputs.snap }}"

      - uses: actions/upload-artifact@v7
        with:
          name: snap
          path: ${{ steps.build.outputs.snap }}
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: snap
    if: inputs.publish && needs.snap.outputs.built == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: snap
          path: snap

      - id: file
        run: |
          shopt -s nullglob
          files=(snap/*.snap)
          if ((${#files[@]} != 1)); then
            echo "::error::expected one snap artifact, found ${#files[@]}"
            exit 1
          fi
          echo "snap=${files[0]}" >> "$GITHUB_OUTPUT"

      - name: Publish the snap
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
          SNAP_CHANNEL: ${{ vars.SNAP_CHANNEL || 'stable' }}
        run: bash scripts/snap-publish.sh "${{ steps.file.outputs.snap }}"
