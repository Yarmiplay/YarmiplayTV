name: Store screenshots

# Replaces the desktop screenshots on the Microsoft Store listing with docs/store/screenshots.
# The package is left as it is. A submission already in certification is waited out first.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  listing:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Submit the screenshots
        env:
          MSSTORE_TENANT_ID: ${{ vars.MSSTORE_TENANT_ID }}
          MSSTORE_CLIENT_ID: ${{ vars.MSSTORE_CLIENT_ID }}
          MSSTORE_CLIENT_SECRET: ${{ secrets.MSSTORE_CLIENT_SECRET }}
        run: python scripts/store-screenshots.py
