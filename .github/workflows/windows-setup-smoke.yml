name: Windows setup smoke

# Proves setup.exe installs with the flags WindowsUpdater uses, and that the MSI updater path
# (version.json → msiexec) can upgrade an installed copy — the Benny 2.7.1 failure mode.
on:
  workflow_dispatch:
    inputs:
      setup_url:
        description: URL of YarmiplayTV-*-setup.exe (empty = build this commit)
        type: string
        required: false
        default: ""
  pull_request:
    paths:
      - "desktop/**"
      - ".github/workflows/windows-setup-smoke.yml"
      - ".github/workflows/release.yml"
      - "scripts/download_site.py"
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - ".github/workflows/windows-setup-smoke.yml"
      - ".github/workflows/release.yml"
      - "scripts/download_site.py"

concurrency:
  group: windows-setup-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  setup-install:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Resolve setup.exe and MSI
        id: pkg
        timeout-minutes: 12
        env:
          GH_TOKEN: ${{ github.token }}
          SETUP_URL: ${{ inputs.setup_url }}
        run: |
          chmod +x gradlew
          version=$(sed -n 's/^val appVersion = "\(.*\)"/\1/p' desktop/build.gradle.kts)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          mkdir -p setup
          if [ -n "$SETUP_URL" ]; then
            curl -fsSL -o "setup/YarmiplayTV-${version}-setup.exe" "$SETUP_URL"
          else
            ./gradlew --stacktrace -PdesktopOnly :desktop:packageExe :desktop:packageMsi
            cp "desktop/build/compose/binaries/main/exe/YarmiplayTV-${version}.exe" \
              "setup/YarmiplayTV-${version}-setup.exe"
            cp "desktop/build/compose/binaries/main/msi/YarmiplayTV-${version}.msi" setup/
          fi
          if [ ! -f "setup/YarmiplayTV-${version}.msi" ]; then
            ./gradlew --stacktrace -PdesktopOnly :desktop:packageMsi
            cp "desktop/build/compose/binaries/main/msi/YarmiplayTV-${version}.msi" setup/
          fi
          test -f "setup/YarmiplayTV-${version}-setup.exe"
          test -f "setup/YarmiplayTV-${version}.msi"
          ls -l setup/

      - name: Fresh install via setup.exe /quiet (2.7.2 exe updater path)
        timeout-minutes: 5
        shell: pwsh
        run: |
          $setup = Join-Path $env:GITHUB_WORKSPACE "setup\YarmiplayTV-${{ steps.pkg.outputs.version }}-setup.exe"
          if (-not (Test-Path -LiteralPath $setup)) { throw "setup.exe missing: $setup" }
          $logDir = Join-Path $env:RUNNER_TEMP "setup-logs"
          New-Item -ItemType Directory -Force -Path $logDir | Out-Null
          $p = Start-Process -FilePath $setup -ArgumentList @("/quiet") -PassThru
          if (-not $p.WaitForExit(300000)) {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            throw "setup.exe /quiet timed out after 5 minutes"
          }
          "quiet exit=$($p.ExitCode)" | Tee-Object -FilePath (Join-Path $logDir "quiet.txt")
          if ($p.ExitCode -notin 0, 3010) { throw "setup.exe /quiet failed: $($p.ExitCode)" }

      - name: Launch installed app --version
        id: app
        timeout-minutes: 3
        shell: pwsh
        run: |
          $exe = Get-ChildItem "$env:LOCALAPPDATA\YarmiplayTV", "$env:LOCALAPPDATA\Programs" `
            -Recurse -Filter "YarmiplayTV.exe" -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -notmatch '\\runtime\\' } |
            Select-Object -First 1
          if (-not $exe) { throw "YarmiplayTV.exe not found after setup.exe /quiet" }
          $exe.FullName | Tee-Object -FilePath "$env:RUNNER_TEMP/installed-path.txt"
          # jpackage launcher needs its install dir on PATH for bundled DLLs; capture both streams.
          $out = Join-Path $env:RUNNER_TEMP "version-out.txt"
          $err = Join-Path $env:RUNNER_TEMP "version-err.txt"
          $p = Start-Process -FilePath $exe.FullName -ArgumentList "--version" `
            -WorkingDirectory $exe.DirectoryName -Wait -PassThru -NoNewWindow `
            -RedirectStandardOutput $out -RedirectStandardError $err
          $ver = ((Get-Content -Raw -ErrorAction SilentlyContinue $out) + (Get-Content -Raw -ErrorAction SilentlyContinue $err)).Trim()
          "exit=$($p.ExitCode)`n$ver" | Tee-Object -FilePath "$env:RUNNER_TEMP/version.txt"
          if ($ver -notmatch 'YarmiplayTV (\d+\.\d+\.\d+)') {
            throw "unexpected --version (exit $($p.ExitCode)): [$ver]"
          }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "exe=$($exe.FullName)"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "dir=$($exe.DirectoryName)"

      - name: MSI upgrade path (launch-time / prompt updater for 2.6.x and 2.7.0)
        timeout-minutes: 5
        shell: pwsh
        run: |
          # Production WindowsUpdater uses msiexec /passive; CI uses /qn so no UI can stall the runner.
          $msi = Join-Path $env:GITHUB_WORKSPACE "setup\YarmiplayTV-${{ steps.pkg.outputs.version }}.msi"
          $exe = "${{ steps.app.outputs.exe }}"
          $dir = "${{ steps.app.outputs.dir }}"
          $version = "${{ steps.pkg.outputs.version }}"
          if (-not (Test-Path -LiteralPath $msi)) { throw "msi missing: $msi" }
          $p = Start-Process msiexec.exe -PassThru -ArgumentList "/i `"$msi`" /qn /norestart"
          if (-not $p.WaitForExit(300000)) {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            throw "msiexec timed out after 5 minutes"
          }
          "msiexec exit=$($p.ExitCode)" | Tee-Object -FilePath "$env:RUNNER_TEMP/setup-logs/msi-upgrade.txt"
          if ($p.ExitCode -notin 0, 3010) { throw "msiexec failed: $($p.ExitCode)" }
          $out = Join-Path $env:RUNNER_TEMP "version-msi-out.txt"
          $err = Join-Path $env:RUNNER_TEMP "version-msi-err.txt"
          $v = Start-Process -FilePath $exe -ArgumentList "--version" -WorkingDirectory $dir `
            -Wait -PassThru -NoNewWindow -RedirectStandardOutput $out -RedirectStandardError $err
          $text = ((Get-Content -Raw -ErrorAction SilentlyContinue $out) + (Get-Content -Raw -ErrorAction SilentlyContinue $err)).Trim()
          "$text"
          if ($text -notmatch "YarmiplayTV $version") { throw "after MSI upgrade (exit $($v.ExitCode)): [$text]" }

      - name: setup.exe /quiet over the MSI install
        timeout-minutes: 5
        shell: pwsh
        run: |
          $setup = Join-Path $env:GITHUB_WORKSPACE "setup\YarmiplayTV-${{ steps.pkg.outputs.version }}-setup.exe"
          $exe = "${{ steps.app.outputs.exe }}"
          $dir = "${{ steps.app.outputs.dir }}"
          $version = "${{ steps.pkg.outputs.version }}"
          $p = Start-Process -FilePath $setup -ArgumentList @("/quiet") -PassThru
          if (-not $p.WaitForExit(300000)) {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            throw "setup.exe /quiet upgrade timed out after 5 minutes"
          }
          "re-quiet exit=$($p.ExitCode)" | Tee-Object -FilePath "$env:RUNNER_TEMP/setup-logs/re-quiet.txt"
          if ($p.ExitCode -notin 0, 3010) { throw "setup.exe /quiet upgrade failed: $($p.ExitCode)" }
          $out = Join-Path $env:RUNNER_TEMP "version-exe-out.txt"
          $err = Join-Path $env:RUNNER_TEMP "version-exe-err.txt"
          $v = Start-Process -FilePath $exe -ArgumentList "--version" -WorkingDirectory $dir `
            -Wait -PassThru -NoNewWindow -RedirectStandardOutput $out -RedirectStandardError $err
          $text = ((Get-Content -Raw -ErrorAction SilentlyContinue $out) + (Get-Content -Raw -ErrorAction SilentlyContinue $err)).Trim()
          "$text"
          if ($text -notmatch "YarmiplayTV $version") { throw "after exe upgrade (exit $($v.ExitCode)): [$text]" }

      - name: Upload logs
        if: always()
        timeout-minutes: 2
        uses: actions/upload-artifact@v7
        with:
          name: windows-setup-smoke-logs
          path: |
            ${{ runner.temp }}/setup-logs/
            ${{ runner.temp }}/installed-path.txt
            ${{ runner.temp }}/version*.txt
          if-no-files-found: ignore
