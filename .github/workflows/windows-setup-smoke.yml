name: Windows setup smoke

# Proves an older MSI install upgrades via msiexec, and the branded setup.exe /quiet installs
# into the per-user folder. Job stays ≤20 minutes.
on:
  workflow_dispatch:
    inputs:
      setup_url:
        description: URL of YarmiplayTV-*-setup.exe (empty = build this commit)
        type: string
        required: false
        default: ""
  pull_request:
    paths:
      - "desktop/**"
      - ".github/workflows/windows-setup-smoke.yml"
      - ".github/workflows/release.yml"
      - "scripts/download_site.py"
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - ".github/workflows/windows-setup-smoke.yml"
      - ".github/workflows/release.yml"
      - "scripts/download_site.py"

concurrency:
  group: windows-setup-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  setup-install:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Resolve packages
        id: pkg
        timeout-minutes: 12
        env:
          GH_TOKEN: ${{ github.token }}
          SETUP_URL: ${{ inputs.setup_url }}
        run: |
          chmod +x gradlew
          version=$(sed -n 's/^val appVersion = "\(.*\)"/\1/p' desktop/build.gradle.kts)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          mkdir -p setup
          # Older release for the upgrade-from path (Benny: 2.6.x / 2.7.0 → new).
          gh release download -R "$GITHUB_REPOSITORY" v2.7.0 -p 'YarmiplayTV-2.7.0.msi' -D setup
          if [ -n "$SETUP_URL" ]; then
            curl -fsSL -o "setup/YarmiplayTV-${version}-setup.exe" "$SETUP_URL"
            ./gradlew --stacktrace -PdesktopOnly :desktop:packageMsi
            cp "desktop/build/compose/binaries/main/msi/YarmiplayTV-${version}.msi" setup/
          else
            ./gradlew --stacktrace -PdesktopOnly :desktop:packageSetupExe :desktop:packageMsi
            cp desktop/build/compose/binaries/main/exe/*-setup.exe \
              "setup/YarmiplayTV-${version}-setup.exe"
            cp "desktop/build/compose/binaries/main/msi/YarmiplayTV-${version}.msi" setup/
          fi
          test -f "setup/YarmiplayTV-2.7.0.msi"
          test -f "setup/YarmiplayTV-${version}-setup.exe"
          test -f "setup/YarmiplayTV-${version}.msi"
          ls -l setup/

      - name: Install older 2.7.0 MSI (pre-update baseline)
        timeout-minutes: 5
        shell: pwsh
        run: |
          $logDir = Join-Path $env:RUNNER_TEMP "setup-logs"
          New-Item -ItemType Directory -Force -Path $logDir | Out-Null
          $old = Join-Path $env:GITHUB_WORKSPACE "setup\YarmiplayTV-2.7.0.msi"
          $p = Start-Process msiexec.exe -PassThru -ArgumentList "/i `"$old`" /qn /norestart"
          if (-not $p.WaitForExit(300000)) {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            throw "msiexec 2.7.0 timed out"
          }
          "msiexec-2.7.0 exit=$($p.ExitCode)" | Tee-Object -FilePath (Join-Path $logDir "msi-270.txt")
          if ($p.ExitCode -notin 0, 3010) { throw "msiexec 2.7.0 failed: $($p.ExitCode)" }

      - name: Locate app and check 2.7.0
        id: app
        timeout-minutes: 3
        shell: pwsh
        run: |
          $exe = Get-ChildItem "$env:LOCALAPPDATA\YarmiplayTV", "$env:LOCALAPPDATA\Programs" `
            -Recurse -Filter "YarmiplayTV.exe" -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -notmatch '\\runtime\\' } |
            Select-Object -First 1
          if (-not $exe) { throw "YarmiplayTV.exe not found after 2.7.0 MSI" }
          $exe.FullName | Tee-Object -FilePath "$env:RUNNER_TEMP/installed-path.txt"
          $out = Join-Path $env:RUNNER_TEMP "version-out.txt"
          $err = Join-Path $env:RUNNER_TEMP "version-err.txt"
          $p = Start-Process -FilePath $exe.FullName -ArgumentList "--version" `
            -WorkingDirectory $exe.DirectoryName -Wait -PassThru -NoNewWindow `
            -RedirectStandardOutput $out -RedirectStandardError $err
          $ver = ((Get-Content -Raw -ErrorAction SilentlyContinue $out) + (Get-Content -Raw -ErrorAction SilentlyContinue $err)).Trim()
          "exit=$($p.ExitCode)`n$ver" | Tee-Object -FilePath "$env:RUNNER_TEMP/version.txt"
          if ($ver -notmatch 'YarmiplayTV 2\.7\.0') { throw "expected 2.7.0 baseline, got: [$ver]" }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "exe=$($exe.FullName)"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "dir=$($exe.DirectoryName)"

      - name: Upgrade via 2.7.2 MSI (version.json / launch-time updater path)
        timeout-minutes: 5
        shell: pwsh
        run: |
          # Production uses /passive; CI uses /qn so no UI can stall the runner.
          $msi = Join-Path $env:GITHUB_WORKSPACE "setup\YarmiplayTV-${{ steps.pkg.outputs.version }}.msi"
          $exe = "${{ steps.app.outputs.exe }}"
          $dir = "${{ steps.app.outputs.dir }}"
          $version = "${{ steps.pkg.outputs.version }}"
          $p = Start-Process msiexec.exe -PassThru -ArgumentList "/i `"$msi`" /qn /norestart"
          if (-not $p.WaitForExit(300000)) {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            throw "msiexec upgrade timed out"
          }
          "msiexec-upgrade exit=$($p.ExitCode)" | Tee-Object -FilePath "$env:RUNNER_TEMP/setup-logs/msi-upgrade.txt"
          if ($p.ExitCode -notin 0, 3010) { throw "msiexec upgrade failed: $($p.ExitCode)" }
          $out = Join-Path $env:RUNNER_TEMP "version-msi-out.txt"
          $err = Join-Path $env:RUNNER_TEMP "version-msi-err.txt"
          $v = Start-Process -FilePath $exe -ArgumentList "--version" -WorkingDirectory $dir `
            -Wait -PassThru -NoNewWindow -RedirectStandardOutput $out -RedirectStandardError $err
          $text = ((Get-Content -Raw -ErrorAction SilentlyContinue $out) + (Get-Content -Raw -ErrorAction SilentlyContinue $err)).Trim()
          "$text" | Tee-Object -FilePath "$env:RUNNER_TEMP/version-after-msi.txt"
          if ($text -notmatch "YarmiplayTV $version") { throw "after MSI upgrade (exit $($v.ExitCode)): [$text]" }

      - name: Fresh setup.exe /quiet on a clean install dir
        timeout-minutes: 10
        shell: pwsh
        run: |
          # The branded setup replaces an MSI of the same version, so uninstall the MSI first.
          $setup = Join-Path $env:GITHUB_WORKSPACE "setup\YarmiplayTV-${{ steps.pkg.outputs.version }}-setup.exe"
          $version = "${{ steps.pkg.outputs.version }}"
          $msi = Join-Path $env:GITHUB_WORKSPACE "setup\YarmiplayTV-${{ steps.pkg.outputs.version }}.msi"
          $u = Start-Process msiexec.exe -PassThru -ArgumentList "/x `"$msi`" /qn /norestart"
          if (-not $u.WaitForExit(300000)) {
            Stop-Process -Id $u.Id -Force -ErrorAction SilentlyContinue
            throw "msiexec uninstall timed out"
          }
          "uninstall exit=$($u.ExitCode)" | Tee-Object -FilePath "$env:RUNNER_TEMP/setup-logs/uninstall.txt"
          # 1605 = product not found; OK if UpgradeCode cleanup already removed it.
          if ($u.ExitCode -notin 0, 1605, 3010) { throw "msiexec uninstall failed: $($u.ExitCode)" }
          $p = Start-Process -FilePath $setup -ArgumentList @("/quiet") -PassThru
          if (-not $p.WaitForExit(480000)) {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            throw "setup.exe /quiet timed out"
          }
          "quiet exit=$($p.ExitCode)" | Tee-Object -FilePath "$env:RUNNER_TEMP/setup-logs/quiet.txt"
          if ($p.ExitCode -notin 0, 3010) { throw "setup.exe /quiet failed: $($p.ExitCode)" }
          $exe = Get-ChildItem "$env:LOCALAPPDATA\YarmiplayTV", "$env:LOCALAPPDATA\Programs" `
            -Recurse -Filter "YarmiplayTV.exe" -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -notmatch '\\runtime\\' } |
            Select-Object -First 1
          if (-not $exe) { throw "YarmiplayTV.exe not found after setup.exe /quiet" }
          $out = Join-Path $env:RUNNER_TEMP "version-exe-out.txt"
          $err = Join-Path $env:RUNNER_TEMP "version-exe-err.txt"
          $v = Start-Process -FilePath $exe.FullName -ArgumentList "--version" -WorkingDirectory $exe.DirectoryName `
            -Wait -PassThru -NoNewWindow -RedirectStandardOutput $out -RedirectStandardError $err
          $text = ((Get-Content -Raw -ErrorAction SilentlyContinue $out) + (Get-Content -Raw -ErrorAction SilentlyContinue $err)).Trim()
          "$text" | Tee-Object -FilePath "$env:RUNNER_TEMP/version-after-exe.txt"
          if ($text -notmatch "YarmiplayTV $version") { throw "after setup.exe (exit $($v.ExitCode)): [$text]" }
          $key = Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\YarmiplayTV'
          if ($key.DisplayVersion -ne $version) { throw "uninstall entry is $($key.DisplayVersion)" }
          $desk = Join-Path ([Environment]::GetFolderPath('Desktop')) 'YarmiplayTV.lnk'
          if (-not (Test-Path -LiteralPath $desk)) { throw "desktop shortcut missing" }

      - name: Upload logs
        if: always()
        timeout-minutes: 2
        uses: actions/upload-artifact@v7
        with:
          name: windows-setup-smoke-logs
          path: |
            ${{ runner.temp }}/setup-logs/
            ${{ runner.temp }}/installed-path.txt
            ${{ runner.temp }}/version*.txt
          if-no-files-found: ignore
