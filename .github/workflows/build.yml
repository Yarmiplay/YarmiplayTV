name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-36 build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v6

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Start a real Syncplay server for the protocol integration test
        run: |
          git clone --depth 1 https://github.com/Syncplay/syncplay "$RUNNER_TEMP/syncplay"
          pip install -q "twisted[tls]" certifi pyopenssl service_identity idna
          python "$RUNNER_TEMP/syncplay/syncplayServer.py" --port 8999 > "$RUNNER_TEMP/syncplay-server.log" 2>&1 &
          for i in $(seq 1 30); do nc -z 127.0.0.1 8999 && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/syncplay-server.log"; exit 1

      - name: Unit tests and debug APK
        env:
          SYNCPLAY_TEST_SERVER: 127.0.0.1:8999
        run: |
          chmod +x gradlew
          ./gradlew --stacktrace :syncplay-protocol:test :media-source:test :shared:desktopTest :app:testDebugUnitTest :app:assembleDebug

      - uses: actions/upload-artifact@v7
        with:
          name: syncplaytv-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            ${{ runner.temp }}/syncplay-server.log

  # Compose UI and local-playback tests on a phone emulator (touch UI, content:// playback through mpv).
  instrumented:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7

      # The runner has ~6 GB free; the emulator's userdata image plus Gradle caches need more headroom.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build app and test APKs
        run: |
          chmod +x gradlew
          ./gradlew --stacktrace :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Instrumented tests on a phone emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disk-size: 2048M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-boot-anim -camera-back none -camera-front none
          script: ./gradlew --stacktrace :app:connectedDebugAndroidTest

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: instrumented-test-reports
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
          if-no-files-found: ignore
