name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-36 build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v6

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Start a real Syncplay server for the protocol integration test
        run: |
          git clone --depth 1 https://github.com/Syncplay/syncplay "$RUNNER_TEMP/syncplay"
          pip install -q "twisted[tls]" certifi pyopenssl service_identity idna
          python "$RUNNER_TEMP/syncplay/syncplayServer.py" --port 8999 > "$RUNNER_TEMP/syncplay-server.log" 2>&1 &
          for i in $(seq 1 30); do nc -z 127.0.0.1 8999 && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/syncplay-server.log"; exit 1

      - name: Unit tests and debug APK
        env:
          SYNCPLAY_TEST_SERVER: 127.0.0.1:8999
        run: |
          chmod +x gradlew
          ./gradlew --stacktrace :syncplay-protocol:test :media-source:test :shared:desktopTest :app:testDebugUnitTest :app:assembleDebug

      - uses: actions/upload-artifact@v7
        with:
          name: syncplaytv-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            ${{ runner.temp }}/syncplay-server.log

  # The desktop app on each OS: its tests (the side panel against a real server, libmpv playback on Linux)
  # and its installers, which the download page picks up by their syncplaytv- artifact names.
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: libmpv, a virtual display and .deb tooling
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q libmpv2 xvfb fakeroot

      - name: Start a real Syncplay server
        run: |
          git clone --depth 1 https://github.com/Syncplay/syncplay "$RUNNER_TEMP/syncplay"
          pip install -q "twisted[tls]" certifi pyopenssl service_identity idna
          python "$RUNNER_TEMP/syncplay/syncplayServer.py" --port 8999 > "$RUNNER_TEMP/syncplay-server.log" 2>&1 &
          python - <<'EOF'
          import socket, time
          for _ in range(30):
              try:
                  socket.create_connection(("127.0.0.1", 8999), 1).close()
                  break
              except OSError:
                  time.sleep(1)
          else:
              raise SystemExit("syncplay-server didn't start")
          EOF

      - name: Desktop tests and installers
        env:
          SYNCPLAY_TEST_SERVER: 127.0.0.1:8999
          # The Windows and macOS runners have no usable OpenGL for libmpv; Linux tests playback on Mesa.
          SYNCPLAYTV_SKIP_MPV_TESTS: ${{ runner.os != 'Linux' && '1' || '' }}
        run: |
          chmod +x gradlew
          display=""; [ "$RUNNER_OS" = Linux ] && display="xvfb-run -a"
          $display ./gradlew --stacktrace :player-mpv-desktop:test :desktop:test :desktop:packageDistributionForCurrentOS

      # apt resolves the package's libmpv dependency; the benchmark's timing targets aren't met on a VM
      # without a GPU, so it only has to play.
      - name: Install the .deb and play a clip with it
        if: runner.os == 'Linux'
        run: |
          deb=$(ls desktop/build/compose/binaries/main/deb/*.deb)
          dpkg-deb -f "$deb" Depends
          # The package registers its menu entry with xdg-desktop-menu, which needs the menus directory a
          # desktop install has and the runner image lacks.
          sudo mkdir -p /etc/xdg/menus/applications-merged
          sudo apt-get install -y -q "./$deb"
          app=$(dpkg -L syncplaytv | grep '/bin/SyncplayTV$')
          "$app" --version | tee "$RUNNER_TEMP/version.txt"
          grep -q "libmpv [0-9]" "$RUNNER_TEMP/version.txt"
          xvfb-run -a -s "-screen 0 1920x1080x24" "$app" --benchmark app/src/androidTest/assets/syncplaytv-sync-clip.mp4 \
            --seconds 10 --out "$RUNNER_TEMP/benchmark.txt" || true
          cat "$RUNNER_TEMP/benchmark.txt"
          grep -Eq "rendered [1-9]" "$RUNNER_TEMP/benchmark.txt"

      - name: jpackage logs
        if: failure()
        run: cat desktop/build/compose/logs/*/*.txt || true

      - uses: actions/upload-artifact@v7
        with:
          name: syncplaytv-desktop-${{ runner.os }}
          path: |
            desktop/build/compose/binaries/main/msi/*.msi
            desktop/build/compose/binaries/main/exe/*.exe
            desktop/build/compose/binaries/main/dmg/*.dmg
            desktop/build/compose/binaries/main/deb/*.deb
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: desktop-screenshots-${{ runner.os }}
          path: desktop/build/desktop-screenshots/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: desktop-test-reports-${{ runner.os }}
          path: |
            **/build/reports/tests/
            ${{ runner.temp }}/syncplay-server.log

  # Compose UI and local-playback tests on a phone emulator (touch UI, content:// playback through mpv),
  # split over two emulators that boot from a cached snapshot.
  instrumented:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        shard: [playback, ui]
    env:
      EMULATOR_OPTIONS: -no-window -gpu swiftshader_indirect -no-boot-anim -camera-back none -camera-front none
    steps:
      - uses: actions/checkout@v7

      # The runner has ~6 GB free; the emulator's userdata image plus Gradle caches need more headroom.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build app and test APKs
        run: |
          chmod +x gradlew
          ./gradlew --stacktrace :app:assembleDebug :app:assembleDebugAndroidTest

      # Bump the key's version when the device settings below change.
      - name: Restore the emulator snapshot
        id: avd-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-34-google_apis-x86_64-pixel_6-2cores-2048M-v3

      - name: Create the emulator snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          disk-size: 2048M
          force-avd-creation: false
          disable-animations: false
          emulator-options: ${{ env.EMULATOR_OPTIONS }}
          script: bash scripts/ci-instrumented.sh snapshot

      # The emulator doesn't always finish writing the snapshot when it's shut down (it leaves a stub
      # snapshot.pb older than ram.bin); caching that would make every later run cold-boot.
      - name: Check the emulator snapshot
        id: snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        run: |
          dir=~/.android/avd/test.avd/snapshots/default_boot
          ls -la "$dir" || true
          if [ -n "$(find "$dir/snapshot.pb" -size +100c 2>/dev/null)" ] && [ ! "$dir/ram.bin" -nt "$dir/snapshot.pb" ]; then
            echo "saved=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::The emulator didn't save its boot snapshot; not caching it"
          fi

      # Saved before the tests run: an emulator that has been tested on carries the app (signed with this
      # runner's debug key) and no longer matches its boot snapshot.
      - name: Save the emulator snapshot
        if: steps.snapshot.outputs.saved == 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: ${{ steps.avd-cache.outputs.cache-primary-key }}

      - name: Instrumented tests (${{ matrix.shard }}) on a phone emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          # The AVD already has 2 cores and 2048M from its creation; setting them here would append them to
          # config.ini again, and the emulator refuses a snapshot whose AVD configuration changed.
          cores: ""
          disk-size: ""
          force-avd-creation: false
          disable-animations: true
          emulator-options: -no-snapshot-save ${{ env.EMULATOR_OPTIONS }}
          script: bash scripts/ci-instrumented.sh ${{ matrix.shard }}

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: instrumented-${{ matrix.shard }}
          path: build/ci-instrumented/
          if-no-files-found: ignore
