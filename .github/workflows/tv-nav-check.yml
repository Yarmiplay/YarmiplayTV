name: TV navigation check (temporary)

on:
  push:
    branches: [cursor/tv-search-again-2.9.4-70be]

jobs:
  tv:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - ref: ""
            tests: com.yarmiplaytv.tv.TvNavigationTest
          - ref: main
            tests: com.yarmiplaytv.tv.TvNavigationTest#browseLibraryWithDpad,com.yarmiplaytv.tv.TvNavigationTest#browseBothServersWithDpad,com.yarmiplaytv.tv.TvNavigationTest#videoAdjustmentsWithDpad
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.ref }}

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Build the app and test APKs
        run: ./gradlew --stacktrace :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: TvNavigationTest on a Google TV emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google-tv
          arch: x86_64
          profile: tv_1080p
          cores: 4
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-boot-anim -no-audio -no-snapshot
          script: |
            mkdir -p build/tv
            adb install -r -t -g app/build/outputs/apk/debug/app-debug.apk
            adb install -r -t -g app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell settings put global hide_error_dialogs 1
            adb logcat -c
            adb shell am instrument -w -r -e class ${{ matrix.tests }} com.yarmiplaytv.test/com.yarmiplaytv.YarmiplayTestRunner 2>&1 | tee build/tv/tv.txt
            adb logcat -d > build/tv/logcat.txt || true
            grep -Eq '^OK \([0-9]+ tests?\)' build/tv/tv.txt

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: tv-navigation-${{ matrix.ref || 'branch' }}
          path: build/tv/
          if-no-files-found: ignore
