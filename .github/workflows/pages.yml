name: Download page

# Publishes the download page (scripts/download_site.py) with packages from the latest GitHub release
# (Windows/macOS/Linux) plus the APK from a green Build of that release's commit when available (else the
# latest green Build on main). Site version / JSON-LD / changelog always follow the latest release tag when
# one exists — never an older green Build that lagged behind a tagged release (see the 2.8.10 / 2.9.0 mix-up).
# The browser version (web/) is built from main at /watch/.
on:
  workflow_run:
    workflows: [Build, Release, Web]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Not a secret: IndexNow checks it against the <key>.txt the site publishes.
  INDEXNOW_KEY: 761915e208733cc08f178728fc5e703f

jobs:
  build:
    # A Release run counts even when it failed: its Play bundle can fail after the Windows installers were
    # released, and without new installers the page comes out the same.
    if: >-
      github.event_name == 'workflow_dispatch' || (github.event.workflow_run.event == 'push' &&
      (github.event.workflow_run.name == 'Release' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')))
    runs-on: ubuntu-latest
    # Long enough to build the player's FFmpeg when its cache is gone.
    timeout-minutes: 30
    outputs:
      site_url: ${{ steps.pages.outputs.base_url }}
    steps:
      - name: Pick release, Build run, and site version
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_BUILD_ID: ${{ github.event.workflow_run.name == 'Build' && github.event.workflow_run.id || '' }}
          TRIGGER_BUILD_SHA: ${{ github.event.workflow_run.name == 'Build' && github.event.workflow_run.head_sha || '' }}
        run: |
          set -euo pipefail
          REL_TAG=$(gh release view -R "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null || true)
          VERSION=
          SITE_REF=main
          REL_SHA=
          if [ -n "$REL_TAG" ]; then
            VERSION=${REL_TAG#v}
            # Tag ref so metainfo / gradle match the published release (not an older green Build).
            SITE_REF=$REL_TAG
            OBJ=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$REL_TAG")
            OBJ_TYPE=$(printf '%s' "$OBJ" | jq -r .object.type)
            OBJ_SHA=$(printf '%s' "$OBJ" | jq -r .object.sha)
            if [ "$OBJ_TYPE" = "tag" ]; then
              REL_SHA=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$OBJ_SHA" --jq .object.sha)
            else
              REL_SHA=$OBJ_SHA
            fi
            echo "Latest release $REL_TAG → commit $REL_SHA"
          fi

          app_ver_at() {
            # Prints appVersion from app/build.gradle.kts at the given commit, or empty.
            gh api "repos/$GITHUB_REPOSITORY/contents/app/build.gradle.kts?ref=$1" --jq .content \
              | base64 -d | sed -n 's/^val appVersion = "\([^"]*\)".*/\1/p' | head -1
          }

          RUN_ID=
          RUN_SHA=
          # Prefer a successful Build of the release commit so the APK matches the tagged version.
          if [ -n "$REL_SHA" ]; then
            MATCH=$(gh run list -R "$GITHUB_REPOSITORY" --workflow build.yml --commit "$REL_SHA" \
              --status success -L 10 --json databaseId,headSha,event \
              --jq '[.[] | select(.event=="push" or .event=="workflow_dispatch")] | .[0] // empty')
            if [ -n "$MATCH" ]; then
              RUN_ID=$(printf '%s' "$MATCH" | jq -r .databaseId)
              RUN_SHA=$(printf '%s' "$MATCH" | jq -r .headSha)
            fi
          fi
          # Else a later green Build on main that still ships the same appVersion (tag Build often fails first).
          if { [ -z "${RUN_ID:-}" ] || [ "$RUN_ID" = "null" ]; } && [ -n "$VERSION" ]; then
            while read -r cand_id cand_sha; do
              [ -n "$cand_id" ] || continue
              cand_ver=$(app_ver_at "$cand_sha" || true)
              if [ "$cand_ver" = "$VERSION" ]; then
                RUN_ID=$cand_id
                RUN_SHA=$cand_sha
                echo "Matched Build $RUN_ID ($RUN_SHA) with appVersion $cand_ver"
                break
              fi
            done < <(gh run list -R "$GITHUB_REPOSITORY" --workflow build.yml --branch main \
              --event push --status success -L 15 --json databaseId,headSha \
              --jq '.[] | "\(.databaseId) \(.headSha)"')
          fi
          if [ -z "${RUN_ID:-}" ] || [ "$RUN_ID" = "null" ]; then
            if [ -n "$TRIGGER_BUILD_ID" ]; then
              RUN_ID=$TRIGGER_BUILD_ID
              RUN_SHA=$TRIGGER_BUILD_SHA
            else
              read -r RUN_ID RUN_SHA < <(gh run list -R "$GITHUB_REPOSITORY" --workflow build.yml --branch main \
                --event push --status success -L 1 --json databaseId,headSha --jq '.[0] | "\(.databaseId) \(.headSha)"')
            fi
          fi
          [ -n "$RUN_ID" ] && [ "$RUN_ID" != "null" ] || { echo "no successful Build run"; exit 1; }

          # No GitHub release yet: site version comes from the Build commit's gradle via checkout.
          if [ -z "$VERSION" ]; then
            SITE_REF=$RUN_SHA
          else
            BUILD_VER=$(app_ver_at "$RUN_SHA" || true)
            if [ -n "$BUILD_VER" ] && [ "$BUILD_VER" != "$VERSION" ]; then
              echo "::warning::APK Build $RUN_ID is appVersion $BUILD_VER, release is $VERSION — Android sideload APK lags until a green Build of $VERSION exists"
            fi
          fi

          echo "id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "sha=$RUN_SHA" >> "$GITHUB_OUTPUT"
          echo "site_ref=$SITE_REF" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Using Build $RUN_ID ($RUN_SHA); site ref $SITE_REF; version ${VERSION:-from gradle}"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.run.outputs.site_ref }}

      # Every artifact of the run whose name starts with yarmiplaytv- (the APK now, desktop packages later)
      # lands flat in dist/; download_site.py sorts the files onto platforms by extension.
      - name: Download the packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "${{ steps.run.outputs.id }}" -R "$GITHUB_REPOSITORY" -p 'yarmiplaytv-*' -D artifacts
          mkdir dist
          find artifacts -type f -exec mv -t dist {} +
          # Release assets replace main's by extension. The .msi is kept for version.json (in-app updates from
          # older installs) but the page UI only links Store / setup .exe / portable zip. Each pattern is
          # optional so a release without setup.exe still refreshes the other platforms.
          mkdir -p release
          any=
          for pat in '*-setup.exe' '*.msi' '*-portable.zip' '*.dmg' '*_amd64.deb'; do
            if gh release download -R "$GITHUB_REPOSITORY" -p "$pat" -D release; then
              any=1
            fi
          done
          if [ -n "$any" ]; then
            for f in release/*; do rm -f dist/*."${f##*.}"; done
            mv release/* dist/
          else
            echo "::warning::No release packages; the page offers the ones from main"
          fi
          ls -l dist

      - id: pages
        uses: actions/configure-pages@v6

      # The Search Console token is the repository variable GOOGLE_SITE_VERIFICATION (HTML-tag method). The
      # Linux store links appear with the variables that switch on release.yml's store jobs.
      # --version from the latest release tag keeps JSON-LD / hero text aligned with published installers even
      # when the APK Build run is still catching up.
      - name: Build the site
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
          GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
          FLATHUB_REPO: ${{ vars.FLATHUB_REPO }}
          SNAP_NAME: ${{ vars.SNAP_NAME }}
          AUR_PACKAGE: ${{ vars.AUR_PACKAGE }}
          SITE_VERSION: ${{ steps.run.outputs.version }}
        run: >
          python3 scripts/download_site.py --dist dist --out _site --site-url "$SITE_URL"
          ${SITE_VERSION:+--version "$SITE_VERSION"}
          --indexnow-key "$INDEXNOW_KEY" ${GOOGLE_SITE_VERIFICATION:+--google-verification "$GOOGLE_SITE_VERIFICATION"}
          ${FLATHUB_REPO:+--flathub-id "${FLATHUB_REPO##*/}"} ${SNAP_NAME:+--snap-name "$SNAP_NAME"}
          ${AUR_PACKAGE:+--aur-package "$AUR_PACKAGE"}

      # The browser version comes from main as it is now, whichever run started this: a change that only touches
      # web/ runs Web, not Build, so the Build run's commit may be older.
      - uses: actions/checkout@v7
        with:
          ref: main
          path: main

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: main/web/package-lock.json

      - name: Player's FFmpeg
        uses: ./main/.github/actions/web-libav
        with:
          root: main

      - name: Build the browser version
        working-directory: main/web
        env:
          MAL_CLIENT_ID: ${{ secrets.MAL_CLIENT_ID }}
        run: |
          npm ci
          npm run build
          cp -r dist "$GITHUB_WORKSPACE/_site/watch"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

      # Bing, DuckDuckGo, Yandex and others recrawl the page without a webmaster account. A failure only warns.
      - name: Notify IndexNow
        env:
          SITE_URL: ${{ needs.build.outputs.site_url }}
        run: |
          site="${SITE_URL%/}"
          host=$(echo "$site" | sed -E 's#^https?://([^/]+).*#\1#')
          body=$(printf '{"host":"%s","key":"%s","keyLocation":"%s/%s.txt","urlList":["%s/","%s/privacy/","%s/manual/","%s/changelog/","%s/watch/"]}' \
            "$host" "$INDEXNOW_KEY" "$site" "$INDEXNOW_KEY" "$site" "$site" "$site" "$site" "$site")
          code=$(curl -s -o response.txt -w '%{http_code}' -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' -d "$body" || true)
          echo "IndexNow answered HTTP $code"; cat response.txt 2>/dev/null || true
          case "$code" in 200|202) ;; *) echo "::warning::IndexNow answered HTTP $code" ;; esac
