name: Download page

# Publishes the download page (scripts/download_site.py) with the packages of the latest green Build on main,
# except for Windows, whose installers come from the latest release. Release runs are for tags,
# so the branch is checked in the job's condition rather than filtered here.
on:
  workflow_run:
    workflows: [Build, Release]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Not a secret: IndexNow checks it against the <key>.txt the site publishes.
  INDEXNOW_KEY: 761915e208733cc08f178728fc5e703f

jobs:
  build:
    # A Release run counts even when it failed: its Play bundle can fail after the Windows installers were
    # released, and without new installers the page comes out the same.
    if: >-
      github.event_name == 'workflow_dispatch' || (github.event.workflow_run.event == 'push' &&
      (github.event.workflow_run.name == 'Release' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      site_url: ${{ steps.pages.outputs.base_url }}
    steps:
      - name: Pick the Build run
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.name == 'Build' && github.event.workflow_run.id || '' }}
          RUN_SHA: ${{ github.event.workflow_run.name == 'Build' && github.event.workflow_run.head_sha || '' }}
        run: |
          if [ -z "$RUN_ID" ]; then
            read -r RUN_ID RUN_SHA < <(gh run list -R "$GITHUB_REPOSITORY" --workflow build.yml --branch main \
              --event push --status success -L 1 --json databaseId,headSha --jq '.[0] | "\(.databaseId) \(.headSha)"')
          fi
          [ -n "$RUN_ID" ] || { echo "no successful Build run on main"; exit 1; }
          echo "id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "sha=$RUN_SHA" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.run.outputs.sha }}

      # Every artifact of the run whose name starts with yarmiplaytv- (the APK now, desktop packages later)
      # lands flat in dist/; download_site.py sorts the files onto platforms by extension.
      - name: Download the packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "${{ steps.run.outputs.id }}" -R "$GITHUB_REPOSITORY" -p 'yarmiplaytv-*' -D artifacts
          mkdir dist
          find artifacts -type f -exec mv -t dist {} +
          # Releases before the portable zip only have the .msi; main's zip stays until one has both.
          if gh release download -R "$GITHUB_REPOSITORY" -p '*.msi' -p '*-portable.zip' -D release; then
            for f in release/*; do rm -f dist/*."${f##*.}"; done
            mv release/* dist/
          else
            echo "::warning::No release with Windows installers; the page offers the ones from main"
          fi
          ls -l dist

      - id: pages
        uses: actions/configure-pages@v6

      # The Search Console token is the repository variable GOOGLE_SITE_VERIFICATION (HTML-tag method).
      - name: Build the site
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
          GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
        run: >
          python3 scripts/download_site.py --dist dist --out _site --site-url "$SITE_URL"
          --indexnow-key "$INDEXNOW_KEY" ${GOOGLE_SITE_VERIFICATION:+--google-verification "$GOOGLE_SITE_VERIFICATION"}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

      # Bing, DuckDuckGo, Yandex and others recrawl the page without a webmaster account. A failure only warns.
      - name: Notify IndexNow
        env:
          SITE_URL: ${{ needs.build.outputs.site_url }}
        run: |
          site="${SITE_URL%/}"
          host=$(echo "$site" | sed -E 's#^https?://([^/]+).*#\1#')
          body=$(printf '{"host":"%s","key":"%s","keyLocation":"%s/%s.txt","urlList":["%s/","%s/privacy/"]}' \
            "$host" "$INDEXNOW_KEY" "$site" "$INDEXNOW_KEY" "$site" "$site")
          code=$(curl -s -o response.txt -w '%{http_code}' -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' -d "$body" || true)
          echo "IndexNow answered HTTP $code"; cat response.txt 2>/dev/null || true
          case "$code" in 200|202) ;; *) echo "::warning::IndexNow answered HTTP $code" ;; esac
