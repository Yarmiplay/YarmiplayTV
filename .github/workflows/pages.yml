name: Download page

# Publishes the download page (scripts/download_site.py) with the packages of the latest green Build on main,
# except for Windows, whose code-signed installers come from the latest release. Release runs are for tags,
# so the branch is checked in the job's condition rather than filtered here.
on:
  workflow_run:
    workflows: [Build, Release]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      (github.event.workflow_run.name == 'Release' || github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Pick the Build run
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.name == 'Build' && github.event.workflow_run.id || '' }}
          RUN_SHA: ${{ github.event.workflow_run.name == 'Build' && github.event.workflow_run.head_sha || '' }}
        run: |
          if [ -z "$RUN_ID" ]; then
            read -r RUN_ID RUN_SHA < <(gh run list -R "$GITHUB_REPOSITORY" --workflow build.yml --branch main \
              --event push --status success -L 1 --json databaseId,headSha --jq '.[0] | "\(.databaseId) \(.headSha)"')
          fi
          [ -n "$RUN_ID" ] || { echo "no successful Build run on main"; exit 1; }
          echo "id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "sha=$RUN_SHA" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.run.outputs.sha }}

      # Every artifact of the run whose name starts with yarmiplaytv- (the APK now, desktop packages later)
      # lands flat in dist/; download_site.py sorts the files onto platforms by extension.
      - name: Download the packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "${{ steps.run.outputs.id }}" -R "$GITHUB_REPOSITORY" -p 'yarmiplaytv-*' -D artifacts
          mkdir dist
          find artifacts -type f -exec mv -t dist {} +
          if gh release download -R "$GITHUB_REPOSITORY" -p '*.msi' -p '*.exe' -D signed; then
            rm -f dist/*.msi dist/*.exe
            mv signed/* dist/
          else
            echo "::warning::No release with Windows installers; the page offers the unsigned ones from main"
          fi
          ls -l dist

      - id: pages
        uses: actions/configure-pages@v6

      - name: Build the site
        run: >
          python3 scripts/download_site.py --dist dist --out _site --site-url "${{ steps.pages.outputs.base_url }}"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
