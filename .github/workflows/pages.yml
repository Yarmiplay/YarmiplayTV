name: Download page

# Publishes the download page (scripts/download_site.py) with the packages of the latest green Build on main.
on:
  workflow_run:
    workflows: [Build]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Pick the Build run
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ -z "$RUN_ID" ]; then
            read -r RUN_ID RUN_SHA < <(gh run list -R "$GITHUB_REPOSITORY" --workflow build.yml --branch main \
              --event push --status success -L 1 --json databaseId,headSha --jq '.[0] | "\(.databaseId) \(.headSha)"')
          fi
          [ -n "$RUN_ID" ] || { echo "no successful Build run on main"; exit 1; }
          echo "id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "sha=$RUN_SHA" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.run.outputs.sha }}

      # Every artifact of the run whose name starts with syncplaytv- (the APK now, desktop packages later)
      # lands flat in dist/; download_site.py sorts the files onto platforms by extension.
      - name: Download the packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "${{ steps.run.outputs.id }}" -R "$GITHUB_REPOSITORY" -p 'syncplaytv-*' -D artifacts
          mkdir dist
          find artifacts -type f -exec mv -t dist {} +
          ls -l dist

      - id: pages
        uses: actions/configure-pages@v6

      - name: Build the site
        run: >
          python3 scripts/download_site.py --dist dist --out _site
          --commit "${{ steps.run.outputs.sha }}" --site-url "${{ steps.pages.outputs.base_url }}"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
