name: Linux packages

# Builds the Linux store packages from this commit the way release.yml publishes them, without publishing: the
# .deb, the AUR package (installed and played in Arch Linux), the snap (installed and played) and the Flatpak
# (Flathub's runtime, then Flathub's linter). Runs when the packaging changes, and by hand.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - packaging/**
      - snap/**
      - scripts/aur-package.sh
      - scripts/snap-smoke-test.sh
      - scripts/snapcraft-build.sh
      - scripts/snapcraft-pack.sh
      - scripts/snap-fetch.sh
      - scripts/snap-store.sh
      - scripts/snap-store-route.sh
      - scripts/flatpak_gradle_sources.py
      - scripts/retry.sh
      - settings.gradle.kts
      - .github/workflows/linux-packages.yml
  push:
    branches: [main]
    paths:
      - packaging/**
      - snap/**
      - scripts/aur-package.sh
      - scripts/snap-smoke-test.sh
      - scripts/snapcraft-build.sh
      - scripts/snapcraft-pack.sh
      - scripts/snap-fetch.sh
      - scripts/snap-store.sh
      - scripts/snap-store-route.sh
      - scripts/flatpak_gradle_sources.py
      - scripts/retry.sh
      - settings.gradle.kts
      - .github/workflows/linux-packages.yml

permissions:
  contents: read

concurrency:
  group: linux-packages-${{ github.ref }}
  cancel-in-progress: true

# MyAnimeList's Client ID for the builds (a repository secret, never in the repository); empty leaves MyAnimeList off.
env:
  MAL_CLIENT_ID: ${{ secrets.MAL_CLIENT_ID }}

jobs:
  deb:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.build.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: .deb
        id: build
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q fakeroot
          chmod +x gradlew
          ./gradlew --stacktrace -PdesktopOnly :desktop:packageDeb
          version=$(sed -n 's/^val appVersion = "\(.*\)"/\1/p' desktop/build.gradle.kts)
          mkdir linux
          cp desktop/build/compose/binaries/main/deb/*.deb "linux/yarmiplaytv_${version}_amd64.deb"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: linux-deb
          path: linux/
          if-no-files-found: error
          retention-days: 7

  aur:
    needs: deb
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: linux-deb
          path: deb

      - name: Build, install and play the package in Arch Linux
        env:
          VERSION: ${{ needs.deb.outputs.version }}
        run: |
          docker run --rm -v "$PWD:/src" -w /src archlinux:latest \
            bash scripts/aur-package.sh "$VERSION" "$VERSION" "deb/yarmiplaytv_${VERSION}_amd64.deb"

  # api.snapcraft.io (185.125.188.54-60) does not accept a connection from GitHub-hosted Ubuntu.
  # These runners try the API and, when one can, upload the content snaps the pack step unpacks.
  # A leg that cannot reach the API fails this job only; continue-on-error keeps the workflow going.
  snap-seed:
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04-arm, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Download content snaps from the Snap Store
        run: bash scripts/snap-fetch.sh .snap-seed

      - uses: actions/upload-artifact@v7
        with:
          name: content-snaps-${{ matrix.os }}
          path: .snap-seed/*.snap
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  snap:
    needs: [deb, snap-seed]
    if: always() && needs.deb.result == 'success' && needs.snap-seed.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: linux-deb
          path: deb

      - run: cp deb/*.deb yarmiplaytv.deb

      - name: Content snaps from a runner that can reach the store
        id: seed
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: content-snaps-*
          path: snap-seeds

      - name: Choose one content-snap set
        run: |
          shopt -s nullglob
          mkdir -p .snap-seed
          for dir in snap-seeds/content-snaps-*; do
            if [[ -f "$dir/bare.snap" && -f "$dir/core24.snap" && -f "$dir/gtk-common-themes.snap" && -f "$dir/gnome-46-2404.snap" && -f "$dir/mesa-2404.snap" ]]; then
              cp -a "$dir"/*.snap .snap-seed/
              echo "Using $dir"
              ls -lh .snap-seed
              exit 0
            fi
          done
          echo "No runner could download the content snaps. The build will probe the store and then stop."

      # DNS and curl -4/-6 for the store hosts, before anything changes the route.
      - name: Diagnose the Snap Store route
        run: bash scripts/snap-store-route.sh

      # Packs with the fetched content snaps, so the store API is not required during the build.
      # A skip remains only when every fetch failed and the probe still gets nothing. This pull
      # request fails the job unless a .snap was produced.
      - id: build
        run: |
          bash scripts/snapcraft-build.sh
          shopt -s nullglob
          snaps=(*.snap)
          if ((${#snaps[@]} > 0)); then
            echo "snap=${snaps[0]}" >> "$GITHUB_OUTPUT"
            echo "built=true" >> "$GITHUB_OUTPUT"
            echo "SNAP_BUILT=${snaps[0]}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "built=false" >> "$GITHUB_OUTPUT"
            echo "SNAP_BUILT=" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Require the built snap
        if: success() && steps.build.outputs.built != 'true'
        run: |
          echo "::error::No .snap was produced. The route diagnostics are above; a skip is not a successful build."
          exit 1

      - name: Install the snap and play a clip
        if: steps.build.outputs.built == 'true'
        run: bash scripts/snap-smoke-test.sh "${{ steps.build.outputs.snap }}"

      - uses: actions/upload-artifact@v7
        if: steps.build.outputs.built == 'true'
        with:
          name: snap
          path: ${{ steps.build.outputs.snap }}
          if-no-files-found: error
          retention-days: 7

  # A build with an empty Gradle home downloads exactly what the Flatpak build needs.
  flatpak-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: List the Gradle files
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/gradle-home
        run: |
          chmod +x gradlew
          ./gradlew --no-configuration-cache --no-build-cache -PdesktopOnly :desktop:generateAppIcons :desktop:createDistributable
          python3 scripts/flatpak_gradle_sources.py "$GRADLE_USER_HOME" gradle-sources.json

      - uses: actions/upload-artifact@v7
        with:
          name: gradle-sources
          path: gradle-sources.json
          retention-days: 7

  flatpak:
    needs: flatpak-sources
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-26.08
      # /var/lib/flatpak on a volume rather than the image's overlay filesystem: once Flathub has newer runtimes than
      # the image, updating them renames directories of the image's layer, which overlayfs refuses with "Invalid
      # cross-device link".
      options: --privileged --volume /var/lib/flatpak
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: gradle-sources
          path: packaging/flatpak

      # Hashed before the next step writes this commit into the manifest, so every commit with the same sources
      # shares the downloads and module builds.
      - name: Cache key
        id: cache-key
        run: echo "key=flatpak-builder-v2-${{ hashFiles('packaging/flatpak/com.yarmiplay.TV.yml', 'packaging/flatpak/gradle-sources.json') }}" >> "$GITHUB_OUTPUT"

      # flatpak-builder clones the checkout (the manifest's git source), which the container user doesn't own;
      # it builds this commit instead of main.
      - run: |
          git config --global --add safe.directory '*'
          sed -i -E "s#^( +)branch: main\$#\1commit: $(git rev-parse HEAD)#" packaging/flatpak/com.yarmiplay.TV.yml
          grep -q "^ *commit: [0-9a-f]\{40\}$" packaging/flatpak/com.yarmiplay.TV.yml

      - uses: actions/cache/restore@v6
        id: cache
        with:
          path: .flatpak-builder
          key: ${{ steps.cache-key.outputs.key }}
          restore-keys: flatpak-builder-v2-

      # flatpak-builder doesn't retry downloads, and ffmpeg.org drops connections from CI runners now and then.
      # What's fetched here (into the state directory) the build doesn't download again.
      - name: Runtimes and sources
        run: |
          scripts/retry.sh flatpak-builder --install-deps-from=flathub --install-deps-only --disable-rofiles-fuse \
            --state-dir .flatpak-builder build-dir packaging/flatpak/com.yarmiplay.TV.yml
          scripts/retry.sh flatpak-builder --download-only --disable-rofiles-fuse \
            --state-dir .flatpak-builder build-dir packaging/flatpak/com.yarmiplay.TV.yml

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: packaging/flatpak/com.yarmiplay.TV.yml
          bundle: yarmiplaytv.flatpak
          # Cached by the steps around this one: the action's own cache only takes an exact key.
          cache: false
          # As Flathub's builder does; its linter checks for the mirrored screenshots.
          mirror-screenshots-url: https://dl.flathub.org/media

      - uses: actions/cache/save@v6
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          path: .flatpak-builder
          key: ${{ steps.cache-key.outputs.key }}

      - name: Flathub's linter
        run: |
          scripts/retry.sh flatpak install -y --noninteractive flathub org.flatpak.Builder
          flatpak run --command=flatpak-builder-lint org.flatpak.Builder manifest packaging/flatpak/com.yarmiplay.TV.yml || true
          flatpak run --command=flatpak-builder-lint org.flatpak.Builder repo repo
