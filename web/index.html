<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>YarmiplayTV</title>
    <meta name="description" content="Watch together in your browser: Syncplay rooms on YarmiplayServerTV, with nothing to install." />
    <meta name="theme-color" content="#0E1116" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <!--
      Scripts only from this site (and WebAssembly for FFmpeg and libass), no plugins, no <base>. Media servers and
      Syncplay servers are whatever the user adds, so pictures and connections may go anywhere.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src * data: blob:; media-src * data: blob:; font-src * data: blob:; connect-src * data: blob: ws: wss: http: https:; object-src 'none'; base-uri 'none'; form-action 'self'"
    />
    <script src="./theme.js"></script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
