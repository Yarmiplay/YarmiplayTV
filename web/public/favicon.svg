<svg xmlns="http://www.w3.org/2000/svg" viewBox="64 64 896 896" aria-hidden="true">
  <defs>
    <linearGradient id="logo-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#152238"/>
      <stop offset="50%" stop-color="#0D1524"/>
      <stop offset="100%" stop-color="#070B12"/>
    </linearGradient>
    <linearGradient id="facet-top" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#A5F3FC"/>
      <stop offset="35%" stop-color="#67E8F9"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="facet-spine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="facet-bot" x1="50%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="50%" stop-color="#0369A1"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>
    <linearGradient id="squircle-rim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#70C4FF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0E1E33" stop-opacity="0.0"/>
    </linearGradient>
  </defs>
  <!-- Squircle Base Tile -->
  <rect x="64" y="64" width="896" height="896" rx="224" fill="url(#logo-bg)"/>
  <rect x="66" y="66" width="892" height="892" rx="222" fill="none" stroke="url(#squircle-rim)" stroke-width="4"/>

  <!-- Centered Bold Play Prism -->
  <polygon points="470,512 830,512 310,832" fill="url(#facet-bot)"/>
  <polygon points="310,192 470,512 310,832" fill="url(#facet-spine)"/>
  <polygon points="310,192 830,512 470,512" fill="url(#facet-top)"/>

  <!-- Subtle Precision Crease Dividers -->
  <line x1="470" y1="512" x2="830" y2="512" stroke="#FFFFFF" stroke-opacity="0.8" stroke-width="3" stroke-linecap="round"/>
  <line x1="310" y1="192" x2="470" y2="512" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="310" y1="832" x2="470" y2="512" stroke="#38BDF8" stroke-opacity="0.5" stroke-width="2" stroke-linecap="round"/>
</svg>